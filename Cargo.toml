[package]
name = "shellsense"
version = "0.1.0"
edition = "2021"
authors = ["Prithibi <prithibi@cachyos>"]
description = "IntelliSense-like terminal command assistant and autocomplete for Linux"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.11"
dirs = "6.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "shellsensd"
path = "src/bin/daemon.rs"

[[bin]]
name = "shellsense"
path = "src/bin/cli.rs"

[lib]
name = "shellsense"
path = "src/lib.rs"
